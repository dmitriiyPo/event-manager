server:
  port: 8080

spring:
  application:
    name: event-manager

  datasource:
    url: jdbc:postgresql://localhost:5433/event_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.web: INFO


springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

jwt:
  lifetime: 86400000
  secret-key: T6kLsUs6AWNH+7T/Q9I7MEKJSvGjvLBx1CQRlG5F48E=

event:
  status:
    cron: 0 */1 * * * *